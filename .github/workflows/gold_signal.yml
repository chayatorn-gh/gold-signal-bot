name: Gold Signal Engine

# ==============================================================================
# Runs the EMA-crossover Gold signal engine every 15 minutes.
# - Fetches fresh GC=F 15m data, checks for a new EMA20/EMA50 crossover,
#   and sends a Telegram alert if one occurred on the latest closed candle.
# - Persists `state.json` (the last processed candle timestamp) back to the
#   repo after each run, so the anti-spam "once per candle" guard survives
#   across runs (GitHub Actions gives each run a brand-new, stateless VM).
# ==============================================================================

on:
  schedule:
    # Every 15 minutes, all day, every day.
    # NOTE: GitHub Actions cron times are always in UTC.
    # The script itself decides whether the market is open (Asia/Bangkok
    # logic lives inside gold_signal_engine.py) -- this schedule just
    # controls how often we check.
    - cron: "*/15 * * * *"
  workflow_dispatch:   # allows manual "Run workflow" button in the Actions tab

# Prevent overlapping runs from stacking up if one run takes longer than 15 min
concurrency:
  group: gold-signal-engine
  cancel-in-progress: false

permissions:
  contents: write   # needed so the workflow can commit state.json back

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal engine (single cycle)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_signal_engine.py

      - name: Commit updated state.json / docs/data.json (if changed)
        run: |
          if [ -n "$(git status --porcelain state.json docs/data.json)" ]; then
            git config user.name "gold-signal-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json docs/data.json
            git commit -m "chore: update signal state + dashboard data [skip ci]"
            git push
          else
            echo "No state change -- nothing to commit."
          fi
